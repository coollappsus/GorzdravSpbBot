services:
  app:
    image: gorzdrav_spb_bot
    container_name: gorzdrav-spb-app
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Europe/Moscow
      - TZ=Europe/Moscow
      - GORZDRAV_API_URL=${GORZDRAV_API_URL}
    volumes:
      - ./application.properties:/config/application.properties:ro
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_internal_net
      - shared_db_net

  postgresql:
    image: postgres:14-alpine
    container_name: gorzdrav_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-gorzdrav_db}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - gorzdrav_pg_data:/var/lib/postgresql/data  # Данные хранятся тут
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      bot_internal_net:
      shared_db_net:
        aliases:
          - db  # Для сторонних проектов эта БД будет доступна по хосту "db"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-gorzdrav_db}" ]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gorzdrav_redis
    restart: unless-stopped
    command: redis-server --port 6339 --dir /data --tcp-keepalive 60 --timeout 0
    volumes:
      - gorzdrav_redis_data:/data # Чтобы кэш или сессии не стирались при перезапуске контейнера
    networks:
      - bot_internal_net # Подключаем к той же внутренней сети, что и приложение
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6339", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 5

networks:
  bot_internal_net:  # Внутренняя сеть для общения бота и его БД
  shared_db_net:     # Общая внешняя сеть для связи со сторонними проектами
    external: true
    name: shared_db_net

volumes:
  gorzdrav_pg_data:  # Объявляем волюм для хранения данных
  gorzdrav_redis_data:
