spring.application.name=gorzdrav_spb_bot
token.bot=${LOCAL_BOT_TOKEN}
gorzdrav.api.url=${LOCAL_GORZDRAV_API_URL}


spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow

telegram.api.base-url=http://localhost:8081/bot

spring.jackson.time-zone=Europe/Moscow