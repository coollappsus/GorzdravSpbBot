services:
  postgresql-local:
    image: postgres:14-alpine
    container_name: gorzdrav_postgres_local
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gorzdrav_db_local
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=local_password
      - TZ=Europe/Moscow
    ports:
      - "5433:5432"
    volumes:
      - gorzdrav_pg_data_local:/var/lib/postgresql/data
    networks:
      - bot_local_net

  gorzdrav-mock:
    image: mockoon/cli:latest
    container_name: gorzdrav_mock
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./mockoon-config.json:/data/mockoon-config.json
    command: ["-d", "/data/mockoon-config.json", "-p", "8080", "--watch"]
    networks:
      - bot_local_net

  redis:
    image: redis:7-alpine
    container_name: gorzdrav_redis
    restart: unless-stopped
    command: redis-server --port 6339 --dir /data
    ports:
      - "127.0.0.1:6339:6339"
    volumes:
      - gorzdrav_redis_data:/data # Чтобы кэш или сессии не стирались при перезапуске контейнера
    networks:
      - bot_local_net # Подключаем к той же внутренней сети, что и приложение

networks:
  bot_local_net:

volumes:
  gorzdrav_pg_data_local:
  gorzdrav_redis_data: